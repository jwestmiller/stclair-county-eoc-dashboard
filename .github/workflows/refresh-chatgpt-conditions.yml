name: Refresh ChatGPT EOC conditions
on:
  schedule:
    - cron: '2-57/5 * * * *'
    - cron: '32 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-chatgpt-conditions.yml'
permissions: {}
concurrency:
  group: chatgpt-eoc-public-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'schedule' || github.event.schedule != '32 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request and verify durable collection
        shell: python
        run: |
          import datetime, json, os, time, urllib.parse, urllib.request
          base = "https://stclair-eoc-shared.fuzzy-pig-5061.chatgpt.site/api/command"
          for attempt in range(3):
              try:
                  query = urllib.parse.urlencode({
                      "source": "github-actions", "run_id": os.environ["GITHUB_RUN_ID"],
                      "attempt": str(attempt + 1), "at": datetime.datetime.now(datetime.timezone.utc).isoformat()
                  })
                  request = urllib.request.Request(base + "?" + query, headers={
                      "Accept": "application/json", "Cache-Control": "no-cache",
                      "User-Agent": "StClairEOC-ConditionsScheduler/1.0"
                  })
                  with urllib.request.urlopen(request, timeout=35) as response:
                      if response.status != 200:
                          raise RuntimeError("Unexpected response status")
                      raw = response.read(4 * 1024 * 1024 + 1)
                  if len(raw) > 4 * 1024 * 1024:
                      raise RuntimeError("Response exceeded limit")
                  data = json.loads(raw)
                  collector = data["collector"]
                  completed = datetime.datetime.fromisoformat(collector["completedAt"].replace("Z", "+00:00"))
                  age = (datetime.datetime.now(datetime.timezone.utc) - completed).total_seconds()
                  if not -300 <= age <= 600:
                      raise RuntimeError("Collector completion is not recent")
                  if collector.get("externalRunId") != os.environ["GITHUB_RUN_ID"]:
                      raise RuntimeError("External request was not recorded")
                  health = data["health"]
                  failures = sum(feed.get("failures", 0) > 0 for feed in health)
                  message = f"Collector verified at {collector['completedAt']}; {failures}/{len(health)} feeds report request failures. See dashboard Feed health for source issues."
                  print(message)
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write(message + "\n")
                  break
              except Exception as error:
                  print(f"Attempt {attempt + 1} failed: {type(error).__name__}")
                  if attempt == 2:
                      raise SystemExit("Collector verification failed after three attempts")
                  time.sleep(20)

  keepalive:
    if: github.event_name != 'schedule' || github.event.schedule == '32 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - name: Maintain repository activity automatically every 28 days
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, datetime, json, os, urllib.error, urllib.request
          now = datetime.datetime.now(datetime.timezone.utc)
          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/contents/.github/scheduler-keepalive.json"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "StClairEOC-SchedulerKeepalive"}
          sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(url + "?ref=main", headers=headers), timeout=30) as response:
                  current = json.load(response)
              sha = current["sha"]
              prior = json.loads(base64.b64decode(current["content"]))
              last = datetime.datetime.fromisoformat(prior["lastKeepaliveUtc"])
              if (now - last).total_seconds() < 28 * 86400:
                  print("Repository keepalive is within 28 days; no commit needed.")
                  raise SystemExit(0)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          content = json.dumps({"purpose": "Maintain unattended ChatGPT EOC scheduler activity", "lastKeepaliveUtc": now.isoformat()}, indent=2) + "\n"
          payload = {"message": "Maintain unattended EOC scheduler activity", "branch": "main", "content": base64.b64encode(content.encode()).decode()}
          if sha:
              payload["sha"] = sha
          request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={**headers, "Content-Type": "application/json"}, method="PUT")
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise RuntimeError("Keepalive commit failed")
          print("Repository keepalive commit succeeded; next due in 28 days.")
